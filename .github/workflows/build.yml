name: Build JARVIS installer

on:
  workflow_dispatch:

  push:
    tags: ["v*"]

jobs:

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows application
        shell: pwsh
        run: |
          ./build_windows.ps1

      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          if (Test-Path "dist\JARVIS\JARVIS.exe") {
              Write-Host "JARVIS.exe found successfully."
          }
          else {
              Write-Error "JARVIS.exe was not found."
              exit 1
          }

      - name: Build Windows installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
              Write-Error "Inno Setup compiler was not found."
              exit 1
          }

          New-Item -ItemType Directory -Force -Path "installer\output" | Out-Null

          & $iscc /O"installer\output" "installer\JARVIS.iss"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Inno Setup failed."
              exit $LASTEXITCODE
          }

      - name: Find generated Windows installer
        shell: pwsh
        run: |
          Get-ChildItem -Path "installer\output" -Filter "*.exe" -Recurse |
            Select-Object FullName, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: installer/output/*.exe
          if-no-files-found: error
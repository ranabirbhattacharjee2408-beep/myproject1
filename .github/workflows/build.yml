name: Build JARVIS installers

on:
  workflow_dispatch:

  push:
    tags: ["v*"]

jobs:

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: ./build_windows.ps1

      - name: Find generated Windows installer
        shell: pwsh
        run: |
          Write-Host "Searching for EXE files..."
          Get-ChildItem -Path . -Filter *.exe -Recurse |
            Select-Object FullName, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: installer/**/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PortAudio
        run: brew install portaudio

      - name: Build macOS DMG
        env:
          CFLAGS: -I/opt/homebrew/include
          LDFLAGS: -L/opt/homebrew/lib
        run: ./build_macos.sh

      - name: Find generated macOS files
        shell: bash
        run: |
          echo "Searching for DMG files..."
          find . -type f -name "*.dmg" -print

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-macOS-DMG
          path: release/*.dmg
          if-no-files-found: error